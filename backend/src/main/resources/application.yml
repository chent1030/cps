spring:
  application:
    name: cps-backend
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: jdbc:mysql://localhost:3306/cps?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: Ct0520.0402
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
flyway:
  baseline-on-migrate: true
  baseline-version: 0
cps:
  storage:
    endpoint: ${CPS_STORAGE_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${CPS_STORAGE_ACCESS_KEY:admin}
    secret-key: ${CPS_STORAGE_SECRET_KEY:Ct0520.0402}
    bucket: ${CPS_STORAGE_BUCKET:cps-attachments}
    public-url: ${CPS_STORAGE_PUBLIC_URL:http://127.0.0.1:9000}
  agent-framework:
    enabled: ${CPS_AGENT_FRAMEWORK_ENABLED:true}
    base-url: http://127.0.0.1:8000/api/v1
    tenant-id: local-factory
    timeout-ms: 180000
  room-check:
    # B3 辅房点检判定（Python C-04 /api/v1/agent/room-checks/judge，单item同步，模型推理240s量级）
    # 波次7 J线对齐：端口8010→8000、路径对齐 C7 冻结 schema、超时 240s（清单①⑧）；未起/超时降级 PENDING 不阻塞提交
    judge:
      enabled: ${CPS_ROOM_CHECK_JUDGE_ENABLED:true}
      base-url: ${CPS_ROOM_CHECK_JUDGE_BASE_URL:http://127.0.0.1:8000}
      path: ${CPS_ROOM_CHECK_JUDGE_PATH:/api/v1/agent/room-checks/judge}
      timeout-ms: ${CPS_ROOM_CHECK_JUDGE_TIMEOUT_MS:240000}
  speech:
    # F3 语音转写（Python C-06 speech-to-text，同步 240s 量级可配）；未配置/失败降级文案不阻塞表单
    enabled: ${CPS_SPEECH_ENABLED:true}
    base-url: ${CPS_SPEECH_BASE_URL:http://127.0.0.1:8000}
    path: ${CPS_SPEECH_PATH:/api/v1/agent/speech-to-text}
    timeout-ms: ${CPS_SPEECH_TIMEOUT_MS:240000}
    max-audio-bytes: ${CPS_SPEECH_MAX_AUDIO_BYTES:20971520}
  initial-review:
    # 初审超时扫描（PRD §28.4）：RUNNING 且超 timeout-at 判 TIMEOUT_OPEN（可接管），30s 一轮
    scan-enabled: ${CPS_INITIAL_REVIEW_SCAN_ENABLED:true}
    scan-interval-ms: ${CPS_INITIAL_REVIEW_SCAN_INTERVAL_MS:30000}
    scan-initial-delay-ms: ${CPS_INITIAL_REVIEW_SCAN_INITIAL_DELAY_MS:15000}
    # 接管阈值（秒）：自提交成功时刻起算；默认 600s = 10 分钟
    timeout-seconds: ${CPS_INITIAL_REVIEW_TIMEOUT_SECONDS:600}
    # C-01 投递给 Python 的回调地址（指向本服务 C-02 端点）
    callback-base-url: ${CPS_INITIAL_REVIEW_CALLBACK_BASE_URL:http://127.0.0.1:8080}
  callback:
    # C-02 来源校验：仅信 TCP 对端地址；本机联调可置 false 放行
    trust-enabled: ${CPS_CALLBACK_TRUST_ENABLED:true}
    trusted-ips: ${CPS_CALLBACK_TRUSTED_IPS:127.0.0.1,::1}
  knowledge:
    vector:
      bootstrap-enabled: ${CPS_KNOWLEDGE_VECTOR_BOOTSTRAP_ENABLED:false}
  ai:
    embedding:
      provider: siglip2
      base-url: ${CPS_EMBEDDING_BASE_URL:http://127.0.0.1:8090}
      endpoint: ${CPS_EMBEDDING_ENDPOINT:/image-embeddings}
      api-key: ${CPS_EMBEDDING_API_KEY:}
      model: ${CPS_EMBEDDING_MODEL:siglip2-so400m-patch14-384}
      model-version: ${CPS_EMBEDDING_MODEL_VERSION:siglip2-v1}
      dimension: ${CPS_EMBEDDING_DIMENSION:1152}
      timeout-ms: ${CPS_EMBEDDING_TIMEOUT_MS:30000}
  milvus:
    enabled: ${CPS_MILVUS_ENABLED:true}
    base-url: ${CPS_VECTOR_SERVICE_BASE_URL:http://localhost:8008}
    api-key: ${CPS_VECTOR_SERVICE_API_KEY:}
    host: ${CPS_MILVUS_HOST:127.0.0.1}
    port: ${CPS_MILVUS_PORT:19530}
    collection: ${CPS_MILVUS_COLLECTION:cps_knowledge_image_vector_siglip2_v1}
    metric-type: ${CPS_MILVUS_METRIC_TYPE:COSINE}
    index-type: ${CPS_MILVUS_INDEX_TYPE:HNSW}
    top-k: ${CPS_MILVUS_TOP_K:10}
